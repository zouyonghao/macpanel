<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacPanel</title>
<link rel="stylesheet" href="/assets/style.css">
<link rel="stylesheet" href="/assets/xterm.min.css">
</head>
<body>
<div id="login-layer">
  <div class="login-card">
    <h1>MacPanel</h1>
    <div class="sub" id="login-sub" data-i18n="macOS Server Panel">macOS Server Panel</div>
    <form id="login-form" data-form="login">
      <label data-i18n="Username">Username</label>
      <input name="username" autocomplete="username" required>
      <label data-i18n="Password">Password</label>
      <input name="password" type="password" autocomplete="current-password" required>
      <div style="margin-top:18px"><button type="submit" style="width:100%" data-i18n="Sign in">Sign in</button></div>
      <div id="login-err" class="sub" style="color:var(--err);margin-top:10px"></div>
    </form>
    <form id="setup-form" class="hidden" data-form="setup">
      <label data-i18n="Set admin username">Set admin username</label>
      <input name="username" autocomplete="username" required>
      <label data-i18n="Set password (at least 10 characters)">Set password (at least 10 characters)</label>
      <input name="password" type="password" autocomplete="new-password" required>
      <div style="margin-top:18px"><button type="submit" style="width:100%" data-i18n="Initialize panel">Initialize panel</button></div>
      <div id="setup-err" class="sub" style="color:var(--err);margin-top:10px"></div>
    </form>
  </div>
</div>

<aside id="nav" class="hidden">
  <div class="logo">Mac<span>Panel</span></div>
  <a href="#dashboard" data-i18n="📊 Dashboard">📊 Dashboard</a>
  <a href="#links" data-i18n="🔗 Quick Links">🔗 Quick Links</a>
  <a href="#services" data-i18n="🧩 Services">🧩 Services</a>
  <a href="#monitors" data-i18n="📡 Monitors">📡 Monitors</a>
  <a href="#cron" data-i18n="⏰ Cron Jobs">⏰ Cron Jobs</a>
  <a href="#ports" data-i18n="🔌 Ports">🔌 Ports</a>
  <a href="#sites" data-i18n="🌐 Sites">🌐 Sites</a>
  <a href="#containers" data-i18n="📦 Containers">📦 Containers</a>
  <a href="#apps" data-i18n="🛍 Apps">🛍 Apps</a>
  <a href="#terminal" data-i18n="💻 Terminal">💻 Terminal</a>
  <a href="#ai" data-i18n="🤖 AI Assistant">🤖 AI Assistant</a>
  <a href="#settings" data-i18n="⚙️ Settings">⚙️ Settings</a>
  <div class="foot"><button class="ghost small" id="lang-toggle" data-act="toggle-lang">中文</button><span id="foot-user"></span></div>
</aside>

<main id="main" class="hidden"></main>

<div id="toasts"></div>
<div id="modal" class="hidden"><div class="box"><h3 id="modal-title"></h3><div class="content" id="modal-content"></div><div style="margin-top:14px;text-align:right"><button class="ghost small" data-act="close-modal" data-i18n="Close">Close</button></div></div></div>

<button class="ghost small" id="lang-toggle-float" data-act="toggle-lang" style="position:fixed;top:12px;right:14px;z-index:99">中文</button>

<script src="/assets/i18n.js"></script>
<script src="/assets/i18n-zh.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
